<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GetFlix Login</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:
      linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
      url('https://assets.nflxext.com/ffe/siteui/vlv3/9e2f4e34-5d73-4f67-8d5b-3d1f6b3f0f60/6b2d57f5-ff66-4f3c-a4f7-8d7b8c8a9f59/IN-en-20240115-popsignuptwoweeks-perspective_alpha_website_large.jpg');

      background-size:cover;
      background-position:center;
      height:100vh;
      color:white;
    }

    /* NAVBAR */

    .navbar{
      padding:20px 50px;
    }

    .logo{
      color:#e50914;
      font-size:40px;
      font-weight:bold;
      letter-spacing:2px;
      cursor:pointer;
    }

    /* LOGIN BOX */

    .login-container{
      display:flex;
      justify-content:center;
      align-items:center;
      height:80vh;
    }

    .login-box{
      background:rgba(0,0,0,0.75);
      padding:60px;
      width:400px;
      border-radius:8px;
    }

    .login-box h1{
      margin-bottom:30px;
      font-size:32px;
    }

    .input-box{
      width:100%;
      padding:15px;
      margin-bottom:20px;
      border:none;
      border-radius:5px;
      background:#333;
      color:white;
      font-size:16px;
    }

    .login-btn{
      width:100%;
      padding:15px;
      border:none;
      border-radius:5px;
      background:#e50914;
      color:white;
      font-size:18px;
      cursor:pointer;
      margin-top:10px;
      transition:0.3s;
    }

    .login-btn:hover{
      background:#f6121d;
    }

    .options{
      display:flex;
      justify-content:space-between;
      margin-top:15px;
      font-size:14px;
      color:#b3b3b3;
    }

    .signup{
      margin-top:40px;
      color:#b3b3b3;
    }

    .signup a{
      color:white;
      text-decoration:none;
      font-weight:bold;
    }

    @media(max-width:768px){

      .navbar{
        padding:20px;
      }

      .logo{
        font-size:32px;
      }

      .login-box{
        width:90%;
        padding:40px 25px;
      }

    }

  </style>
</head>

<body>

  <!-- NAVBAR -->

  <div class="navbar">

    <h1 class="logo">GETFLIX</h1>

  </div>

  <!-- LOGIN FORM -->

  <div class="login-container">

    <div class="login-box">

      <h1>Sign In</h1>

      <input type="email"
      class="input-box"
      placeholder="Email or phone number">

      <input type="password"
      class="input-box"
      placeholder="Password">

      <button class="login-btn">
        Sign In
      </button>

      <div class="options">

        <label>
          <input type="checkbox">
          Remember me
        </label>

        <p>Need help?</p>

      </div>

      <div class="signup">

        New to GetFlix?
        <a href="#">Sign up now</a>

      </div>

    </div>

  </div>

  <!-- LOGIN REDIRECT SCRIPT -->

  <script>

    const loginBtn = document.querySelector(".login-btn");

    loginBtn.addEventListener("click", function(){

      window.location.href = "index.html";

    });

  </script>

</body>
</html>
